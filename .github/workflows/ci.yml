name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnucobol

      - name: Build
        run: bash scripts/build.sh

      - name: Unit tests
        run: bash scripts/test-unit.sh

      - name: Nightly cycle (20,000 transactions)
        run: bash scripts/run-cycle.sh 20000

      - name: Checkpoint/restart test
        run: bash scripts/test-restart.sh

      - name: Publish cycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-reports
          path: build/cycle/*.txt
          if-no-files-found: ignore
